language: en-US
tone_instructions: "Be concise and practical. Prioritize bugs, security risks, payment issues, Firebase rule mistakes, regressions, and missing tests over style-only feedback."

reviews:
  profile: assertive
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: false
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  path_instructions:
    - path: "functions/**/*.js"
      instructions: |
        Treat Cloud Functions as high-risk backend code. Focus on authentication, authorization, secret handling, payment verification, input validation, idempotency, and unsafe data exposure.
    - path: "firestore.rules"
      instructions: |
        Review Firestore rules for broken access control, privilege escalation, data leakage, field-level write restrictions, and unintended anonymous or broad authenticated access.
    - path: "storage.rules"
      instructions: |
        Review Storage rules for cross-user file access, document privacy leaks, overly broad staff permissions, and unsafe public reads.
    - path: "admin.html"
      instructions: |
        Focus on admin-side security and operational safety. Flag unsafe innerHTML usage, exposed sensitive data, missing guards around high-risk actions, and workflow regressions in profile, payout, and settings areas.
    - path: "dashboard.html"
      instructions: |
        Focus on member-visible regressions, privacy exposure, payment flow issues, and P-number lookup behavior.
    - path: "parichayam-firebase.js"
      instructions: |
        Focus on client-to-backend trust boundaries, state syncing, auth/session handling, payment calls, and any path that could leak or overwrite sensitive configuration.
    - path: "**/*.html"
      instructions: |
        De-prioritize cosmetic feedback unless it affects usability, security, accessibility, or production behavior.
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
    ignore_usernames:
      - dependabot[bot]
      - renovate[bot]
  pre_merge_checks:
    title:
      mode: warning
      requirements: "Use a short, descriptive PR title that clearly states the user-facing or technical change."

